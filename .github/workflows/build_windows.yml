name: Build (Windows)

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64, i686, aarch64, armv7]
        configuration: [Debug, Release]
        include:
          - arch: x86_64
            target: x86_64-w64-mingw32
            run_tests: true
          - arch: i686
            target: i686-w64-mingw32
            run_tests: true
          - arch: aarch64
            target: aarch64-w64-mingw32
            run_tests: false
          - arch: armv7
            target: armv7-w64-mingw32
            run_tests: false

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download llvm-mingw
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download                         ^
          --repo mstorsjo/llvm-mingw                ^
          --pattern "llvm-mingw-*-ucrt-x86_64.zip"
      shell: cmd

    - name: Extract llvm-mingw
      run: |
        Get-ChildItem -Filter "llvm-mingw-*-ucrt-x86_64.zip" | ForEach-Object {
          Expand-Archive -Path $_.FullName -DestinationPath .
        }
        Get-ChildItem -Directory -Filter "llvm-mingw*" | Rename-Item -NewName "llvm-mingw"
        # Add LLVM tools to PATH.
        # This also adds LLVM runtime DLLs to PATH, which is required for llvm-min-tblgen.
        [System.IO.File]::AppendAllLines(
          $env:GITHUB_PATH,
          [string[]]@("${{ github.workspace }}\llvm-mingw\bin")
        )
      shell: powershell

    - name: Build Host REPEAT
      run: |
        cmake                                                 ^
          -B build_host                                       ^
          -S .                                                ^
          -G Ninja                                            ^
          -DCMAKE_BUILD_TYPE=Release                          ^
          -DCMAKE_C_COMPILER=clang.exe                        ^
          -DCMAKE_CXX_COMPILER=clang++.exe
        cmake --build build_host --config Release
      shell: cmd

    - name: Configure
      run: |
        setlocal EnableDelayedExpansion

        set LLVM_TABLEGEN=build_host\_deps\llvm_minimal-build\bin\llvm-min-tblgen.exe
        set LLVM_TABLEGEN=${{ github.workspace }}\!LLVM_TABLEGEN!

        cmake                                                                 ^
          -B build_${{ matrix.arch }}_${{ matrix.configuration }}             ^
          -S .                                                                ^
          -G Ninja                                                            ^
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}                      ^
          -DCMAKE_SYSTEM_NAME=Windows                                         ^
          -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}                         ^
          -DCMAKE_C_COMPILER="${{ matrix.target }}-clang.exe"                 ^
          -DCMAKE_CXX_COMPILER="${{ matrix.target }}-clang++.exe"             ^
          -DLLVM_TABLEGEN=!LLVM_TABLEGEN!                                     ^
          -DREPEAT_TOOL_EXE=${{ github.workspace }}\build_host\src\repeat.exe
      shell: cmd

    - name: Build
      run: |
        cmake                                                           ^
          --build build_${{ matrix.arch }}_${{ matrix.configuration }}  ^
          --config ${{ matrix.configuration }}
      shell: cmd

    - name: Run Tests
      if: matrix.run_tests
      run: |
        ctest                                                             ^
          --test-dir build_${{ matrix.arch }}_${{ matrix.configuration }} ^
          --output-on-failure                                             ^
          --build-config ${{ matrix.configuration }}
      shell: cmd

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: repeat-windows-${{ matrix.arch }}-${{ matrix.configuration }}
        path: build_${{ matrix.arch }}_${{ matrix.configuration }}/src/repeat.exe
